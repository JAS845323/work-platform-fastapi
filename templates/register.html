{% extends "base.html" %}

{% block title %}註冊新帳戶{% endblock %}

{% block content %}
<div class="card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
        <h2 class="card-title text-center fw-bold mb-4" style="color: #002c6a;">建立新帳戶</h2>

        <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
        
        <form id="register-form">
            <div class="mb-3">
                <label for="username" class="form-label fw-medium">使用者名稱</label>
                <input type="text" id="username" name="username" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label fw-medium">Email</label>
                <input type="email" id="email" name="email" class="form-control form-control-lg" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label fw-medium">密碼</label>
                <input type="password" id="password" name="password" class="form-control form-control-lg" required>
            </div>
            <div class="mb-4">
                <label for="role" class="form-label fw-medium">您的身分</label>
                <select id="role" name="role" class="form-select form-select-lg">
                    <option value="client">我是委託人 (發布專案)</option>
                    <option value="contractor">我是接案人 (承接專案)</option>
                </select>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg fw-bold">註冊</button>
            </div>
        </form>
        
        <div class="text-center mt-4 form-footer">
            已經有帳戶了？ <a href="/">返回登入</a>
        </div>
    </div>
</div>
{% endblock %}


{% block scripts %}
<script>
    document.getElementById("register-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = event.target.username.value;
        const email = event.target.email.value;
        const password = event.target.password.value;
        const role = event.target.role.value;
        const errorMessage = document.getElementById("error-message");

        try {
            const response = await fetch("/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password,
                    role: role
                })
            });

            if (response.ok) {
                window.location.href = "/?registered=true";
            } else {
                const data = await response.json();
                errorMessage.textContent = data.detail || "註冊失敗。";
                errorMessage.classList.remove("d-none");
            }
        } catch (error) {
            errorMessage.textContent = "發生網路錯誤，請稍後再試。";
            errorMessage.classList.remove("d-none");
        }
    });
</script>
{% endblock %}
