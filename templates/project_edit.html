{% extends "base.html" %}

{% block title %}修改專案 - {{ project.title }}{% endblock %}

{% block content %}
<div class="glass-card">
    <h2 class="card-title text-center fw-bold mb-4" style="color: #ffffff; font-weight: 300; font-size: 2.2rem;">
        修改專案
    </h2>

    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="error-message" style="color: #c4ffc4; background-color: rgba(45, 206, 137, 0.15); border-color: rgba(45, 206, 137, 0.3);"></div>

    <form id="edit-project-form">
        <div class="form-group">
            <label for="title">專案標題</label>
            <input type="text" id="title" name="title" class="glass-input" value="{{ project.title }}" required>
        </div>
        <div class="form-group">
            <label for="description">專案描述</label>
            <textarea id="description" name="description" class="glass-input" rows="5" placeholder="詳細說明您的需求...">{{ project.description }}</textarea>
        </div>
        <div class="form-group" style="margin-top: 2rem;">
            <button type="submit" class="glass-button">儲存變更</button>
        </div>
        <div class="form-footer">
            <a href="/project/{{ project.id }}">取消</a>
        </div>
    </form>
</div>
{% endblock %}


{% block scripts %}
<script>
    document.getElementById("edit-project-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const title = event.target.title.value;
        const description = event.target.description.value;
        const errorMessage = document.getElementById("error-message");
        const successMessage = document.getElementById("success-message");

        // 取得 project_id
        const PROJECT_ID = {{ project.id }};

        try {
            // *** 關鍵：呼叫 API 8 (PUT) ***
            const response = await fetch(`/api/projects/${PROJECT_ID}`, {
                method: "PUT",
                headers: { 
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: title,
                    description: description
                })
            });

            if (response.ok) {
                errorMessage.style.display = "none";
                successMessage.textContent = "專案修改成功！ 2 秒後將返回專案頁面...";
                successMessage.style.display = "block";
                
                setTimeout(() => {
                    window.location.href = `/project/${PROJECT_ID}`;
                }, 2000);

            } else {
                const data = await response.json();
                errorMessage.textContent = data.detail || "修改失敗。";
                errorMessage.style.display = "block";
                successMessage.style.display = "none";
            }
        } catch (error) {
            errorMessage.textContent = "發生網路錯誤，請稍後再試。";
            errorMessage.style.display = "block";
            successMessage.style.display = "none";
        }
    });
</script>
{% endblock %}
