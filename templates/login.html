{% extends "base.html" %}

{% block title %}登入 - 工作委託平台{% endblock %}

{% block content %}
<div class="card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
        <h2 class="card-title text-center fw-bold mb-4" style="color: #002c6a;">登入您的帳戶</h2>

        <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label fw-medium">使用者名稱</label>
                <input type="text" id="username" name="username" class="form-control form-control-lg" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-medium">密碼</label>
                <input type="password" id="password" name="password" class="form-control form-control-lg" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg fw-bold">登入</button>
            </div>
        </form>
        
        <div class="text-center mt-4 form-footer">
            沒有帳戶？ <a href="/register">立即註冊</a>
        </div>
    </div>
</div>
{% endblock %}


{% block scripts %}
<script>
    document.getElementById("login-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = event.target.username.value;
        const password = event.target.password.value;
        const errorMessage = document.getElementById("error-message");
        
        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: username, password: password })
            });

            if (response.ok) {
                errorMessage.classList.add("d-none"); // 隱藏錯誤
                window.location.href = "/dashboard";
            } else {
                const data = await response.json();
                errorMessage.textContent = data.detail || "登入失敗，請檢查帳號密碼。";
                errorMessage.classList.remove("d-none"); // 顯示錯誤
            }
        } catch (error) {
            errorMessage.textContent = "發生網路錯誤，請稍後再試。";
            errorMessage.classList.remove("d-none");
        }
    });
</script>
{% endblock %}
